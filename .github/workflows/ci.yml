name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Test with pytest
        run: pytest --cov=file_ferry --cov-report=term-missing

  desktop:
    name: desktop (node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares `engines.node: >=20`, so both are exercised
        # rather than only the version used for local development.
        node-version: ['20', '22']

    defaults:
      run:
        working-directory: desktop

    env:
      # The suite never loads Electron (no test imports it), and neither
      # tsc nor vite needs the runtime. Skipping the ~100MB binary keeps
      # the job fast and removes a flaky download from the critical path;
      # the npm package and its TypeScript types are still installed, so
      # electron/*.ts is still type-checked.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint:eslint

      # oxlint loads the anti-slop plugin as a .ts file, which relies on
      # Node's TypeScript type-stripping. Node 20 cannot import .ts at all
      # (ERR_UNKNOWN_FILE_EXTENSION), so this half runs on 22 only. A lint
      # only needs to run once; everything else below still runs on both,
      # which is what actually establishes Node 20 support.
      - name: Lint (anti-slop oxlint)
        if: matrix.node-version == '22'
        run: npm run lint:anti-slop

      - name: Check formatting
        run: npm run format:check

      - name: Type-check (source and tests)
        run: npm run typecheck

      - name: Test with vitest
        run: npm test

      - name: Build
        run: npm run build
