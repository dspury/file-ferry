name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Test with pytest
        run: pytest --cov=file_ferry --cov-report=term-missing

  # macOS leg of the Python suite. The package classifies itself
  # MacOS/POSIX and the operators who run ferry work on macOS, but CI only
  # ever proved the suite on Linux — and the codebase has real
  # platform-specific surface (drive detection shells out to `mount` vs
  # `diskutil`-adjacent paths, volume enumeration, path handling).
  #
  # Kept as its own job rather than an `os:` entry in the matrix above so
  # the existing check names — which branch protection on `main` requires
  # — stay stable. Add the three names this job produces to the required
  # contexts after this lands.
  test-macos:
    name: test (macos, py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # The macOS runner images already carry ffmpeg for some versions of
      # the image; brew is a fast no-op when they do.
      - name: Install ffmpeg
        run: |
          brew install ffmpeg
          ffmpeg -version | head -1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ruff and mypy are OS-independent and already gate every Linux leg;
      # repeating them here only adds minutes. The suite itself — the part
      # that can behave differently on darwin — is what runs.
      - name: Test with pytest
        run: pytest --cov=file_ferry --cov-report=term-missing

  desktop:
    name: desktop (node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches `engines.node: >=22`. The floor is 22 because oxlint loads
        # the anti-slop plugin as a .ts file, which relies on Node's
        # TypeScript type-stripping — Node 20 cannot import .ts at all.
        node-version: ['22']

    defaults:
      run:
        working-directory: desktop

    env:
      # The suite never loads Electron (no test imports it), and neither
      # tsc nor vite needs the runtime. Skipping the ~100MB binary keeps
      # the job fast and removes a flaky download from the critical path;
      # the npm package and its TypeScript types are still installed, so
      # electron/*.ts is still type-checked.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + anti-slop oxlint)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check (source and tests)
        run: npm run typecheck

      - name: Test with vitest
        run: npm test

      - name: Build
        run: npm run build
