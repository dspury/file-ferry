name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks working tree and history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA, not by tag. This is the job that decides
      # whether a secret reached the repository, so the code it runs must be
      # immutable: a floating `@v7` re-resolves on every run and a moved tag
      # would silently change what scans us. `ci.yml` floats by tag on
      # purpose -- a compromised action there breaks a build, not a
      # disclosure boundary.
      #
      # The trailing comment is the only human-readable half of a SHA pin, so
      # it names the exact release and must be updated with the SHA. Keep
      # them in step: Dependabot bumped this pin from v6.0.3 to v7.0.1 in
      # #109 and left the comment reading `# v6`, which is how the pin came
      # to claim a major it had not been on for weeks.
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          chmod 700 gitleaks

      - name: Scan working tree and full Git history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: ./scripts/secret-scan.sh all
